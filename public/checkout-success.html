<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Payment... - Phantom V2</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0a0a09; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; padding: 40px; border: 1px solid #2a2a3e; border-radius: 12px; background: #15151a; }
    .spinner { width: 40px; height:  40px; border:  4px solid #2a2a3e; border-top-color: #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; margin:  0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.4rem; margin-bottom: 10px; }
    p { color: #a0a0b0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Payment received. Confirming your license...</h1>
    <p>Please wait - you will be redirected automatically.</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var orderID = params.get('token') || params.get('orderID') || '';
    var plan = localStorage.getItem('phantom_checkout_plan') || 'pro';
    if (orderID) {
      setTimeout(function() {
        window.location.replace('./index.html?checkout=success&token=' + encodeURIComponent(orderID) + '&plan=' + encodeURIComponent(plan));
      }, 800);
    } else {
      setTimeout(function() { window.location.href = './index.html#pricing'; }, 1500);
    }
  </script>
</body>
</html>
