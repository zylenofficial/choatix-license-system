# Render.com Blueprint - auto-configures the backend deployment
# When you connect this repo on Render, everything below is pre-filled.
# You will only be asked to paste STRIPE_SECRET_KEY.
services:
  - type: web
    name: choatix-license-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: BASE_URL
        value: https://zylenofficial.github.io/choatix-v2/
